name: "Pull Request Test"

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  USERNAME: ${{github.repository_owner}}
  FEED_URL: https://nuget.pkg.github.com/${{github.repository_owner}}/index.json
  VCPKG_BINARY_SOURCES: "clear;nuget,https://nuget.pkg.github.com/${{github.repository_owner}}/index.json,readwrite"

jobs:
  pre-commit:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            **/pyproject.toml
            **/requirements*.txt

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install clang-format (Linux static binary)
        run: |
          sudo wget -qO /usr/local/bin/clang-format https://github.com/cpp-linter/clang-tools-static-binaries/releases/latest/download/clang-format-20_linux-amd64
          sudo chmod a+x /usr/local/bin/clang-format
          clang-format --version
      - id: file_changes
        uses: tj-actions/changed-files@v46

      - name: Run pre-commit (changed files)
        uses: pre-commit/action@v3.0.1
        with:
          extra_args: --color always --files ${{ steps.file_changes.outputs.all_changed_files }}

  build-linux:
    name: Build Linux
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11"]
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            **/pyproject.toml
            **/requirements*.txt

        run: |
          sudo apt-get update
          sudo apt-get purge cmake
          sudo apt-get install -y \
            ninja-build build-essential \
            pkg-config autoconf automake libtool \
            zip unzip \
            bison swig \
            libdrm-dev \
            libx11-dev libxkbcommon-x11-dev libx11-xcb-dev \
            libxft-dev libxext-dev libgles2-mesa-dev \
            libxi-dev libxtst-dev libxrandr-dev libltdl-dev \
            gtk2.0 libgtk2.0-dev \
            python3-setuptools python3-jinja2 python3-tk \
            mono-complete
      - name: Setup cmake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.28.3'
      - # https://github.com/lukka/CppBuildTasks-Validation/blob/v10/.github/workflows/hosted-ninja-vcpkg.yml
        name: "Install vcpkg"
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: '${{ runner.workspace }}/b/vcpkg'
          vcpkgJsonGlob: "src/vcpkg.json"
          vcpkgConfigurationJsonGlob: "src/vcpkg-configuration.json"
      - name: Add NuGet sources
        shell: bash
        env:
          VCPKG_EXE: ${{ runner.workspace }}/b/vcpkg/vcpkg
        run: |
          mono `${{ env.VCPKG_EXE }} fetch nuget | tail -n 1` \
            sources add \
            -Source "${{ env.FEED_URL }}" \
            -StorePasswordInClearText \
            -Name GitHubPackages \
            -UserName "${{ env.USERNAME }}" \
            -Password "${{ secrets.GH_VCPKG_PACKAGES_TOKEN }}"
          mono `${{ env.VCPKG_EXE }} fetch nuget | tail -n 1` \
            setapikey "${{ secrets.GH_VCPKG_PACKAGES_TOKEN }}" \
            -Source "${{ env.FEED_URL }}"
      - name: "Create virtual Environment"
        run: |
          python${{ matrix.python-version }} -m venv .venv
          source .venv/bin/activate
          echo "VIRTUAL ENV:" $VIRTUAL_ENV
      - name: "Install required Python dependencies"
        run: source .venv/bin/activate && pip3 install -r requirements.txt
      - name: "Generate build recipes"
        env:
          VCPKG_BINARY_SOURCES: "clear;nuget,${{env.FEED_URL}},readwrite"
        run: source .venv/bin/activate && cd src/ && cmake --preset ci-test
      - name: "Build basilisk"
        run: source .venv/bin/activate && cd src/ && cmake --build ../dist3/
      - name: "Install Basilisk"
        run: source .venv/bin/activate && pip3 install -e .
      - name: "Run Python Tests"
        run: |
          source .venv/bin/activate
          cd src && pytest -n auto -m "not scenarioTest" --junitxml=../junit/test-results-${{ matrix.python-version }}.xml
      - name: "Upload pytest test results"
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-${{ matrix.python-version }}
          path: junit/test-results-${{ matrix.python-version }}.xml
        # Use always() to always run this step to publish test results when there are test failures
        if: ${{ always() }}
      - name: "Run C/C++ Tests"
        working-directory: ./dist3
        run: ctest
        if: ${{ always() }}

  build-windows:
    if: 'false'
    name: Build Windows
    runs-on: windows-2022
    strategy:
      matrix:
        python-version: ["3.10"]
    permissions:
      actions: read
      contents: read
      security-events: write
    env:
      MPLBACKEND: agg
      CONAN_USER_HOME: C:\Users\runneradmin\
      CONAN_USER_HOME_SHORT: None
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: '**/requirements.txt'
      - name: Cache conan packages
        id: cache-conan
        uses: actions/cache@v4
        env:
          cache-name: cache-conan-packages
        with:
          path: C:\Users\runneradmin\.conan
          key:
            conan-packages-${{ runner.os }}-hash-${{ hashFiles('conanfile.py') }}
          restore-keys: |
            conan-packages-${{ runner.os }}-hash-
      - name: Choco help
        uses: crazy-max/ghaction-chocolatey@v3
        with:
          args: -h
      - name: "Install swig and cmake"
        shell: pwsh
        run: choco install swig cmake -y
      - name: "Create python virtual env"
        shell: pwsh
        run: python -m venv venv
      - name: "Install wheel and conan package"
        shell: pwsh
        run: |
            venv\Scripts\activate
            pip install -r requirements.txt
      - name: "Add basilisk and cmake path to env path"
        shell: pwsh
        run: |
          $oldpath = (Get-ItemProperty -Path 'Registry::HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\Session Manager\Environment' -Name PATH).path
          $newpath = “$oldpath;${{ env.GITHUB_WORKSPACE }}\dist3\Basilisk;C:\Program Files\CMake\bin”
          Set-ItemProperty -Path 'Registry::HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\Session Manager\Environment' -Name PATH -Value $newPath
      - name: "Build basilisk"
        shell: pwsh
        run: |
          venv\Scripts\activate
          python conanfile.py --opNav True
      - name: "Test Simulation Python"
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'Registry::HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\Session Manager\Environment' -Name MPLBACKEND -Value ${MPLBACKEND}
          venv\Scripts\activate
          cd src\simulation
          (Get-ChildItem -Directory).FullName | ForEach-Object { cd $_; pytest -n auto -m "not scenarioTest"; if(($LastExitCode -ne 0) -and ($LastExitCode -ne 5)) {exit 1}}
      - name: "Python Architecture Tests"
        shell: pwsh
        run: |
          venv\Scripts\activate
          cd src\architecture
          (Get-ChildItem -Directory).FullName | ForEach-Object { cd $_; pytest -n auto; if(($LastExitCode -ne 0) -and ($LastExitCode -ne 5)) {exit 1}}
      - name: "Python FswAlgorithms Tests"
        shell: pwsh
        run: |
          venv\Scripts\activate
          cd src\fswAlgorithms
          (Get-ChildItem -Directory).FullName | ForEach-Object { cd $_; pytest -n auto; if(($LastExitCode -ne 0) -and ($LastExitCode -ne 5)) {exit 1}}
      - name: "C/C++ Tests"
        shell: pwsh
        run: |
          cd dist3
          ctest
          if(($LastExitCode -ne 0) -and ($LastExitCode -ne 5)) {exit 1}
