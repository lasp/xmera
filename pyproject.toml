[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "basilisk"
version = "0.1.0"
description = "Basilisk: Flexible, Fast, and Reconfigurable Space Simulation Framework"
requires-python = ">=3.9, <3.13"
dependencies = [
    "bokeh",
    "dask==2024.8.0; python_version < '3.10'",
    "dask==2024.12; python_version >= '3.10'",
    "datashader==0.16.3",
    "delimited-protobuf==1.0.0",
    "holoviews==1.19.1",
    "hvplot==0.10.0",
    "matplotlib",
    "numpy<2.0.0",
    "opencv-contrib-python",
    "opencv-python",
    "pandas",
    "param==2.1.1",
    "parse>=1.18.0",
    "Pillow",
    "protobuf==3.19.1",
    "tqdm"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-html",
    "pytest-xdist"
]
docs = [
    "breathe",
    "docutils",
    "recommonmark",
    "sphinx==5.0.2",
    "sphinx_rtd_theme==0.5.1"
]

[tool.setuptools.packages.find]
where = ["dist3"]
